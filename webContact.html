<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EGD - Matrix</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background-color: #000;
        color: #00ff66;
        font-family: 'Courier New', monospace;
        overflow: hidden;
    }

    canvas {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 1;
    }

    /* Линия сканирования (ЭЛТ эффект) */
    body::after {
        content: " ";
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 2px;
        background: rgba(0, 255, 102, 0.1);
        z-index: 10;
        pointer-events: none;
        animation: scanline 8s linear infinite;
    }

    @keyframes scanline {
        0% { top: -10%; }
        100% { top: 110%; }
    }

    .content {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        text-align: center;
        background: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(1px);
        padding: 20px;
    }

    h1, h2, p, ul, footer, #link-container {
        opacity: 0;
        margin: 10px 0;
    }

    h1 { font-size: 3rem; text-shadow: 0 0 15px #00ff66; margin-bottom: 0; }
    h2 { font-size: 1.1rem; color: rgba(0, 255, 102, 0.6); margin-top: 5px; margin-bottom: 30px; }
    ul { list-style: none; padding: 0; }
    li::before { content: "> "; }

    #demo-link { 
        color: #00ff66; 
        text-decoration: none; 
        border: 1px solid #00ff66;
        padding: 10px 20px;
        transition: all 0.3s ease;
        display: inline-block;
        margin: 20px 0;
        text-transform: uppercase;
        letter-spacing: 2px;
    }
    
    #demo-link:hover { 
        background: #ff0033; 
        color: #fff; 
        border-color: #ff0033;
        box-shadow: 0 0 20px #ff0033;
    }

    .cursor {
        display: inline-block;
        width: 10px;
        height: 1.2rem;
        background: #00ff66;
        margin-left: 5px;
        animation: blink 1s step-end infinite;
        vertical-align: middle;
    }

    @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>

<canvas id="matrix"></canvas>

<div class="content">
    <h1 id="title"></h1>
    <h2 id="subtitle"></h2>
    <p id="intro"></p>
    <div id="link-container"><a id="demo-link" href="https://demo.gadukov.nl" target="_blank"></a></div>
    <ul id="skills"></ul>
    <footer id="footer"></footer>
</div>

<script>
const canvas = document.getElementById('matrix');
const ctx = canvas.getContext('2d');

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄ';
const fontSize = 16;
const columns = canvas.width / fontSize;
const drops = Array(Math.floor(columns)).fill(1);

function drawMatrix() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#00ff66';
    ctx.font = fontSize + 'px monospace';

    for (let i = 0; i < drops.length; i++) {
        const text = chars[Math.floor(Math.random() * chars.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
    }
}
setInterval(drawMatrix, 40);

function type(el, text, speed, callback) {
    el.style.opacity = 1;
    el.textContent = ''; 
    let i = 0;
    const timer = setInterval(() => {
        el.textContent += text.charAt(i);
        i++;
        if (i >= text.length) {
            clearInterval(timer);
            if (callback) callback();
        }
    }, speed);
}

window.onload = () => {
    const title = document.getElementById('title');
    const subtitle = document.getElementById('subtitle');
    const intro = document.getElementById('intro');
    const linkContainer = document.getElementById('link-container');
    const link = document.getElementById('demo-link');
    const skills = document.getElementById('skills');
    const footer = document.getElementById('footer');

    type(title, 'EGD', 100, () => {
        type(subtitle, 'Developer & System Architect', 60, () => {
            // ВОТ ОНО!
            type(intro, 'Wake up... The code has you.', 50, () => {
                setTimeout(() => {
                    linkContainer.style.opacity = 1;
                    type(link, 'HTTPS://DEMO.GADUKOV.NL', 50, () => {
                        skills.style.opacity = 1;
                        const items = ['Python, Django, Swift...', 'HTML, CSS, Java...'];
                        let current = 0;

                        function nextSkill() {
                            if (current < items.length) {
                                const li = document.createElement('li');
                                skills.appendChild(li);
                                type(li, items[current], 40, () => {
                                    current++;
                                    setTimeout(nextSkill, 300);
                                });
                            } else {
                                type(footer, '© 2026 EGD', 40, () => {
                                    const cursor = document.createElement('span');
                                    cursor.className = 'cursor';
                                    footer.appendChild(cursor);
                                });
                            }
                        }
                        nextSkill();
                    });
                }, 600);
            });
        });
    });
};
</script>

</body>
</html>
